<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dynamic Resume Builder - 2 Page Max HTML Exporter</title>
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div class="app-container">
    <!-- TOP NAVIGATION BAR -->
    <header class="top-navbar">
      <div class="brand">
        <div class="brand-icon">R</div>
        <div class="brand-text">
          <h1>HTML Resume Generator</h1>
          <p>Reference-Inspired 2-Page Resume Builder</p>
        </div>
      </div>
      <div class="nav-actions">
        <button id="btn-load-preset" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Load Reference Preset
        </button>
        <button id="btn-clear-form" class="btn btn-outline-danger">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear Form
        </button>
        <button id="btn-copy-html" class="btn btn-secondary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2" ry="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
          Copy HTML
        </button>
        <button id="btn-print-pdf" class="btn btn-success">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 6 2 18 2 18 9"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/></svg>
          Print / Save PDF
        </button>
        <button id="btn-download-html" class="btn btn-primary">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
          Download HTML Resume
        </button>
      </div>
    </header>

    <div class="main-content">
      <!-- LEFT EDITOR FORM PANEL -->
      <aside class="editor-panel">
        <div class="editor-header">
          <h2>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
            Edit Resume Details
          </h2>
          <span style="font-size: 11px; color: #94a3b8;">Customizable Links & Platforms</span>
        </div>

        <div class="editor-sections" id="editor-sections-wrapper">
          <!-- 1. PERSONAL DETAILS & SOCIAL URLS -->
          <div class="form-group-card" id="card-header-details">
            <div class="form-card-title">
              <span>Header & Profile Details</span>
            </div>
            <div class="form-card-body">
              <div class="form-field">
                <label>Full Name</label>
                <input type="text" id="input-fullName" placeholder="e.g. Rahul Varma">
              </div>
              <div class="form-field">
                <label>Role Title</label>
                <input type="text" id="input-title" placeholder="e.g. Software Developer">
              </div>
              <div class="form-field">
                <label>Location</label>
                <input type="text" id="input-location" placeholder="e.g. Surampalem, Andhra Pradesh, India">
              </div>
              <div class="form-field">
                <label>Profile Photo (Upload from device or enter URL)</label>
                <div style="display: flex; flex-direction: column; gap: 8px;">
                  <input type="text" id="input-avatarUrl" placeholder="https://... or click Upload Photo below">
                  <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                    <input type="file" id="input-avatarFile" accept="image/*" style="display: none;">
                    <button type="button" id="btn-upload-photo" class="btn btn-secondary btn-sm" style="flex: 1; justify-content: center;">
                      📷 Upload Photo
                    </button>
                    <button type="button" id="btn-remove-photo" class="btn btn-outline-danger btn-sm" style="justify-content: center;">
                      🗑️ Remove
                    </button>
                  </div>
                </div>
              </div>

              <!-- SOCIAL / CONTACT LINKS DYNAMIC MANAGER -->
              <div style="border-top: 1px solid #334155; margin-top: 8px; padding-top: 10px;">
                <div style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;">
                  <label style="color: var(--primary); font-size: 13px; font-weight: 700;">Contact & Social Links (Add/Remove Any)</label>
                </div>

                <div id="social-links-editor-list">
                  <!-- Dynamically rendered social link item editors -->
                </div>

                <button id="btn-add-social-link" class="btn-add-item" style="margin-top: 6px;">
                  + Add Contact / Social Link
                </button>
              </div>
            </div>
          </div>

          <!-- DYNAMIC ORDERED SECTIONS CONTAINER -->
          <div id="dynamic-sections-container" style="display: flex; flex-direction: column; gap: 16px;">
            <!-- Dynamically rendered section cards with Move Up, Move Down, Show/Hide, Delete -->
          </div>

          <!-- ADD CUSTOM SECTION CARD -->
          <div class="add-custom-section-box">
            <h3>Add New Custom Section</h3>
            <div class="grid-2" style="margin-bottom: 10px;">
              <div class="form-field">
                <label>Section Title</label>
                <input type="text" id="input-custom-section-title" placeholder="e.g. WORK EXPERIENCE / EDUCATION">
              </div>
              <div class="form-field">
                <label>Section Layout Type</label>
                <select id="select-custom-section-type">
                  <option value="text">Paragraph / Text Block</option>
                  <option value="pills">Pill Badges Grid</option>
                  <option value="list">Bullet Points List</option>
                </select>
              </div>
            </div>
            <button id="btn-add-custom-section" class="btn btn-primary" style="width: 100%; justify-content: center;">
              + Create & Add Section
            </button>
          </div>
        </div>
      </aside>

      <!-- RIGHT LIVE PREVIEW PANEL -->
      <main class="preview-panel">
        <div class="preview-toolbar">
          <div class="page-indicator" id="page-count-badge">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/></svg>
            Page Constraint: <span id="page-count-text">1 of 2 max pages</span>
          </div>
          <p style="font-size: 12px; color: #64748b;">Live A4 Interactive Preview</p>
        </div>

        <!-- RESUME CANVAS -->
        <div class="resume-paper" id="resume-canvas">
          <!-- Dynamic Resume HTML gets compiled here -->
        </div>
      </main>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
