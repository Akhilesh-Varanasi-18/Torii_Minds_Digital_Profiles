name: Keep Render warm

# Pings the app's health endpoint on a schedule so the free Render instance
# never sleeps. Render sleeps after ~15 min of no traffic, so every 10 min
# keeps it awake with margin. Also runnable manually from the Actions tab.
on:
  schedule:
    # Every 5 min for a tighter margin. NOTE: GitHub scheduled workflows are
    # best-effort and are often delayed or skipped — for reliable warmth use an
    # external monitor (UptimeRobot / cron-job.org) pointed at /api/health.
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /api/health
        run: |
          URL="https://torii-minds-digital-profiles.onrender.com/api/health"
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 "$URL" || echo "000")
            echo "attempt $i -> HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "health endpoint did not return 200 after 3 attempts"
          exit 1
